name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Build static Linux binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag must be a semantic version in vMAJOR.MINOR.PATCH form: $VERSION" >&2
            exit 1
          fi

          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" \
              -o "slurmtui-linux-$arch" \
              ./cmd/slurmtui
          done

          sha256sum slurmtui-linux-amd64 slurmtui-linux-arm64 > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$VERSION"
          slurmtui-linux-amd64
          slurmtui-linux-arm64
          SHA256SUMS
          --verify-tag
          --title "$VERSION"
          --generate-notes
