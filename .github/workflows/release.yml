name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Test
        run: make test

      - name: Build static Linux binaries
        id: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_KIND="$(go run ./tools/releasetag "$VERSION")"
          echo "release_kind=$RELEASE_KIND" >> "$GITHUB_OUTPUT"

          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" \
              -o "slurmtui-linux-$arch" \
              ./cmd/slurmtui
          done

          sha256sum slurmtui-linux-amd64 slurmtui-linux-arm64 > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          RELEASE_KIND: ${{ steps.build.outputs.release_kind }}
        run: |
          args=("$VERSION" slurmtui-linux-amd64 slurmtui-linux-arm64 SHA256SUMS --verify-tag --title "$VERSION" --generate-notes)
          if [[ "$RELEASE_KIND" == "prerelease" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
